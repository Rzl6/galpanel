# GALPANEL V2.1 - ZMK feature configuration

# The EC11 is a required part of the design.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Required by the side-key pointer movement and EC11 mouse wheel behaviors.
CONFIG_ZMK_POINTING=y

# Final firmware status module drives LINK, INFO, WARN and AUX. The former
# FN white LED remains off because the production keymap is now single-layer.
CONFIG_GALPANEL_STATUS_INDICATORS=y
CONFIG_GALPANEL_LINK_ON_MS=30000
CONFIG_GALPANEL_PROFILE_NAMES=y
CONFIG_GALPANEL_SAFETY_TEST=y

# ZMK's documented Windows BLE/GATT compatibility workaround. It does not
# change Profile/bond allocation or Android/iOS behavior.
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Allow wake-up from the direct GPIO keys and reduce battery consumption.
CONFIG_ZMK_SLEEP=y
