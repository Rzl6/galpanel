# GALPANEL V2.1 - ZMK feature configuration

# The EC11 is a required part of the design.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Required by the base-layer mouse wheel behavior.
CONFIG_ZMK_POINTING=y

# D0 AUX blue: on for the selected USB endpoint, off for BLE/no endpoint.
CONFIG_GALPANEL_ENDPOINT_LED=y

# Allow wake-up from the direct GPIO keys and reduce battery consumption.
CONFIG_ZMK_SLEEP=y
