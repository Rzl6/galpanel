# GALPANEL V2.1 - ZMK feature configuration

# The EC11 is a required part of the design.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Required by the base-layer mouse wheel behavior.
CONFIG_ZMK_POINTING=y

# Final firmware status module drives LINK, INFO, FN, WARN and AUX.
CONFIG_GALPANEL_STATUS_INDICATORS=y
CONFIG_GALPANEL_LINK_ON_MS=30000
CONFIG_GALPANEL_PROFILE_NAMES=y

# Allow wake-up from the direct GPIO keys and reduce battery consumption.
CONFIG_ZMK_SLEEP=y
